[pytest]
# pythonpath = . lets tests do `from app.rag import ...` without
# installing the package. Run pytest from the backend/ directory.
pythonpath = .
testpaths = tests

# Lets async test functions run without an explicit decorator on each.
asyncio_mode = auto

markers =
    integration: needs a running Ollama server (deselect with -m "not integration")

addopts = -v --tb=short
